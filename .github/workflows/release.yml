name: Release

# Go packages are released by pushing a semver tag. On every successful push to
# main we compute the next version from conventional commits (feat -> minor,
# fix/other -> patch, "!" or BREAKING CHANGE -> major), tag it and publish a
# GitHub release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            range="HEAD"
            major=0; minor=0; patch=0
          else
            range="$last..HEAD"
            IFS=. read -r major minor patch <<<"${last#v}"
          fi

          if [ -n "$last" ] && [ -z "$(git rev-list "$range")" ]; then
            echo "No new commits since $last"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          log=$(git log "$range" --format='%s%n%b%n==')
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<<"$log"; then
            if [ "$major" -eq 0 ]; then minor=$((minor+1)); patch=0; else major=$((major+1)); minor=0; patch=0; fi
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi

          # First release starts at v0.1.0
          if [ -z "$last" ]; then major=0; minor=1; patch=0; fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Warm Go module proxy
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl -fsS "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY,,}/@v/${TAG}.info" || true
